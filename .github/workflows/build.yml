name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Zefari-Client-Source-1.zip -d proje
      - run: sed -i 's/net.minecraft.client.render.CameraSubmersionType/net.minecraft.block.enums.CameraSubmersionType/' proje/src/main/java/com/zefari/mixin/BackgroundRendererMixin.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
        working-directory: proje
      - uses: actions/upload-artifact@v4
        with:
          name: Zefari
          path: proje/build/libs/*.jar
